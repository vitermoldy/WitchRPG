<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crimson Sovereign: RPG aksi 3D first-person. Bengkokkan realitas dengan sihir Chaos dan bangkitkan musuh yang kalah menjadi pasukan bayangan." />
    <meta name="theme-color" content="#0c0809" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Crimson Sovereign</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="Dunia game Crimson Sovereign"></canvas>

      <div id="hud" class="hud" hidden>
        <div id="overload-veil" class="veil veil-chaos" aria-hidden="true"></div>
        <div id="hurt-veil" class="veil veil-hurt" aria-hidden="true"></div>

        <header class="rift-status">
          <p id="rift-name" class="rift-name">Rift Tier I</p>
          <p id="rift-wave" class="rift-wave"></p>
          <p id="rift-left" class="rift-left num"></p>
        </header>

        <div id="banner" class="banner" aria-hidden="true">
          <p class="banner-title"></p>
          <p class="banner-sub"></p>
        </div>

        <div id="feed" class="feed" role="log" aria-live="polite"></div>
